name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m tools.format --check
      - run: python -m tests.check_repo
      - name: ExeFS and NPDM bounds
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -Iruntime/source tests/exefs_checks.c -o build/exefs_checks
          ./build/exefs_checks
  managed-controls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Controls against modeled game boundaries
        shell: pwsh
        run: ./tests/check_controls.ps1 -CompileHelper
